    <rect x="10" y="10" width="14" height="50"/>
    <rect x="34" y="10" width="14" height="50"/>
    <rect x="58" y="10" width="14" height="50"/>
    <rect x="82" y="10" width="14" height="50"/>
    <rect x="106" y="10" width="14" height="50"/>
    <rect x="304" y="10" width="14" height="50"/>
    <rect x="328" y="10" width="14" height="50"/>
    <rect x="352" y="10" width="14" height="50"/>
    <rect x="376" y="10" width="14" height="50"/>

    <rect x="10" y="140" width="14" height="50"/>
    <rect x="34" y="140" width="14" height="50"/>
    <rect x="58" y="140" width="14" height="50"/>
    <rect x="82" y="140" width="14" height="50"/>
    <rect x="106" y="140" width="14" height="50"/>
    <rect x="304" y="140" width="14" height="50"/>
    <rect x="328" y="140" width="14" height="50"/>
    <rect x="352" y="140" width="14" height="50"/>
    <rect x="376" y="140" width="14" height="50"/>

